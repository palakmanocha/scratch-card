<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Scratch Card Creator</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Playfair Display',serif;
    background:#f4f4f4;
    min-height:100vh;
    padding:20px;
}

.container{
    max-width:1200px;
    margin:auto;
}

h1{
    margin-bottom:20px;
}

.creator{
    display:grid;
    grid-template-columns:380px 1fr;
    gap:20px;
}

.panel{
    background:white;
    padding:20px;
    border-radius:20px;
    box-shadow:0 5px 18px rgba(0,0,0,.08);
}

label{
    display:block;
    margin-top:15px;
    font-weight:600;
}

textarea,
select{
    width:100%;
    margin-top:8px;
    padding:12px;
    border-radius:12px;
    border:1px solid #ddd;
}

button{
    width:100%;
    padding:14px;
    margin-top:20px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    color:white;
    font-size:16px;
}

.primary{
    background:#2563eb;
}

.primary:hover{
    background:#1d4ed8;
}

.copyBtn{
    background:#16a34a;
}

.copyBtn:hover{
    background:#15803d;
}

.card{
    width:700px;
    max-width:100%;
    aspect-ratio:16/10;
    border-radius:30px;
    overflow:hidden;
    position:relative;
    box-shadow:
      0 15px 35px rgba(0,0,0,.18);
}

.previewWrap{
    display:flex;
    justify-content:center;
    align-items:center;
}

.message{
    position:absolute;
    inset:0;

    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
    text-align:center;
}

.messageBox{
    padding:24px 34px;
    background:rgba(255,255,255,.18);
    backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.25);
    border-radius:24px;
    max-width:85%;
}

.messageText{
    font-family:'Great Vibes',cursive;
    font-size:4rem;
    line-height:1.2;
}

canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    z-index:10;
}

.linkBox{
    margin-top:15px;
    word-break:break-all;
}

.themeRose{
    background:
    linear-gradient(
        135deg,
        #ff758c,
        #ff7eb3
    );
}

.themeMidnight{
    background:
    linear-gradient(
        135deg,
        #141e30,
        #243b55
    );
}

.themeBirthday{
    background:
    linear-gradient(
        135deg,
        #f6d365,
        #fda085
    );
}

.themeChristmas{
    background:
    linear-gradient(
        135deg,
        #11998e,
        #38ef7d
    );
}

.themeLavender{
    background:
    linear-gradient(
        135deg,
        #7f53ac,
        #647dee
    );
}

.revealTitle{
    text-align:center;
    margin-bottom:20px;
}

@media(max-width:900px){

.creator{
    grid-template-columns:1fr;
}

.messageText{
    font-size:2.8rem;
}

}

</style>

</head>

<body>

<div id="app"></div>

<script>

const THEMES = {

rose:{
    className:"themeRose",
    text:"#fff"
},

midnight:{
    className:"themeMidnight",
    text:"#fff"
},

birthday:{
    className:"themeBirthday",
    text:"#222"
},

christmas:{
    className:"themeChristmas",
    text:"#fff"
},

lavender:{
    className:"themeLavender",
    text:"#fff"
}

};

const app =
document.getElementById("app");

function encode(data){

return btoa(
encodeURIComponent(
JSON.stringify(data)
));

}

function decode(data){

return JSON.parse(
decodeURIComponent(
atob(data)
));

}

function escapeHTML(text){

return text
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;");

}

function buildCreator(){

app.innerHTML = `

<div class="container">

<h1>🎫 Scratch Card Creator</h1>

<div class="creator">

<div class="panel">

<label>Secret Message</label>

<textarea
id="message"
rows="5">I have a surprise for you ❤️</textarea>

<label>Theme</label>

<select id="theme">

<option value="rose">
❤️ Romantic Rose
</option>

<option value="midnight">
🌙 Midnight Love
</option>

<option value="birthday">
🎂 Birthday
</option>

<option value="christmas">
🎄 Christmas
</option>

<option value="lavender">
💜 Lavender
</option>

</select>

<button
class="primary"
id="generateBtn">

Generate Link

</button>

<div
class="linkBox"
id="linkOutput"></div>

</div>

<div class="panel">

<h3>Preview</h3>

<br>

<div class="previewWrap">

<div
id="previewCard"
class="card themeRose">

<div class="message">

<div class="messageBox">

<div
id="previewText"
class="messageText">

I have a surprise for you ❤️

</div>

</div>

</div>

</div>

</div>

</div>

</div>

</div>

`;

const message =
document.getElementById("message");

const theme =
document.getElementById("theme");

const previewText =
document.getElementById("previewText");

const previewCard =
document.getElementById("previewCard");

function updatePreview(){

const currentTheme =
THEMES[theme.value];

previewText.textContent =
message.value;

previewText.style.color =
currentTheme.text;

previewCard.className =
"card " +
currentTheme.className;

}

message.addEventListener(
'input',
updatePreview
);

theme.addEventListener(
'change',
updatePreview
);

document
.getElementById("generateBtn")
.addEventListener("click",()=>{

const payload = {

m: message.value,
t: theme.value

};

const link =

location.origin +
location.pathname +
"#" +
encode(payload);

document
.getElementById("linkOutput")
.innerHTML =

`
<p><b>Share this link:</b></p>
<br>

<a href="${link}">
${link}
</a>

<br><br>

<button
class="copyBtn"
onclick="navigator.clipboard.writeText('${link}')">

Copy Link

</button>
`;

});

updatePreview();

}

function buildScratchCard(data){

const theme =
THEMES[data.t] ||
THEMES.rose;

app.innerHTML = `

<div class="container">

<div class="revealTitle">

<h1>✨ Scratch To Reveal ✨</h1>

</div>

<div class="previewWrap">

<div
id="card"
class="card ${theme.className}">

<div class="message">

<div class="messageBox">

<div
class="messageText"
style="color:${theme.text};">

${escapeHTML(data.m)}

</div>

</div>

</div>

<canvas id="scratch"></canvas>

</div>

</div>

</div>

`;

const canvas =
document.getElementById("scratch");

const card =
document.getElementById("card");

const ctx =
canvas.getContext("2d");

canvas.width =
card.offsetWidth;

canvas.height =
card.offsetHeight;

ctx.fillStyle =
"#d4af37";

ctx.fillRect(
0,
0,
canvas.width,
canvas.height
);

ctx.fillStyle =
"rgba(255,255,255,.25)";

ctx.font =
"bold 42px Arial";

ctx.textAlign =
"center";

ctx.fillText(
"SCRATCH HERE",
canvas.width/2,
canvas.height/2
);

let drawing = false;

function scratch(x,y){

ctx.globalCompositeOperation =
"destination-out";

ctx.beginPath();

ctx.arc(
x,
y,
28,
0,
Math.PI*2
);

ctx.fill();

}

canvas.addEventListener(
"mousedown",
()=> drawing = true
);

window.addEventListener(
"mouseup",
()=> drawing = false
);

canvas.addEventListener(
"mousemove",
e=>{

if(!drawing) return;

const rect =
canvas.getBoundingClientRect();

scratch(
e.clientX - rect.left,
e.clientY - rect.top
);

});

canvas.addEventListener(
"touchstart",
()=> drawing = true
);

canvas.addEventListener(
"touchend",
()=> drawing = false
);

canvas.addEventListener(
"touchmove",
e=>{

if(!drawing) return;

e.preventDefault();

const rect =
canvas.getBoundingClientRect();

const touch =
e.touches[0];

scratch(
touch.clientX - rect.left,
touch.clientY - rect.top
);

},
{passive:false});

}

if(location.hash){

try{

const payload =
decode(
location.hash.substring(1)
);

buildScratchCard(payload);

}catch{

buildCreator();

}

}else{

buildCreator();

}

</script>

</body>
</html>
